<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5c400">
<title>Yellow Car</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="apple-touch-icon" href="yellow-car-bmw.png?v=5">
<style>
:root{--yellow:#f5c400;--ink:#121212;--paper:#fff;--soft:#f3f3f3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}
main{max-width:560px;margin:auto;padding:22px 18px 40px}
.hero{text-align:center;padding:12px 0 18px}
.hero-car{display:block;width:min(290px,80vw);height:auto;margin:0 auto 2px}
.hero h1{font-size:44px;margin:4px 0 0;font-weight:950;letter-spacing:-2px}
.tag{font-weight:700}.sub{color:#666}
.card{border:1px solid #ddd;border-radius:24px;padding:20px;margin-top:16px}
.hidden{display:none}.players{display:grid;gap:10px}
.pick,.score{display:flex;align-items:center;justify-content:space-between;border:1px solid #ddd;border-radius:18px;padding:15px 16px;font-size:20px;font-weight:800}
input{width:25px;height:25px}
.primary{width:100%;border:0;border-radius:18px;padding:17px;background:#111;color:var(--yellow);font-size:19px;font-weight:900;margin-top:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.total{font-size:34px;font-weight:950}
.timer{border:1px solid #ddd;border-radius:13px;padding:9px 11px;font-weight:800}
.score{min-height:82px;margin:10px 0}.plus{width:58px;height:58px;border:0;border-radius:50%;background:var(--yellow);font-size:34px;font-weight:950}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{border:1px solid #ccc;border-radius:16px;background:white;padding:15px;font-weight:800}
.finish{border:0;border-radius:16px;background:#111;color:var(--yellow);padding:15px;font-weight:900}
.celebrate{position:sticky;top:10px;z-index:2;text-align:center;background:var(--yellow);padding:14px;border-radius:18px;font-size:22px;font-weight:950;margin-bottom:10px}
.winner{text-align:center;font-size:34px;font-weight:950}.history{margin-top:20px}.history-item{padding:12px 0;border-top:1px solid #eee}
.small{font-size:13px;color:#666;text-align:center;margin-top:12px}
</style>
</head>
<body><main>
<section class="hero">
<img class="hero-car" src="yellow-car-bmw.png?v=5" alt="Yellow Car">
<h1>YELLOW CAR</h1>
<div class="tag">Spot it. Say it. Score it.</div>
<div class="sub">Thomas's Family Edition</div>
</section>
<div id="flash" class="celebrate hidden"></div>
<section id="setup" class="card">
<h2>Who's playing?</h2><div class="players">
<label class="pick">👩 Mum <input id="mum" type="checkbox" checked></label>
<label class="pick">👨 Dad <input id="dad" type="checkbox" checked></label>
<label class="pick">👦 Thomas <input id="thomas" type="checkbox" checked></label>
</div><button id="start" class="primary">🚗 Start game</button>
<div id="history" class="history"></div>
</section>
<section id="game" class="card hidden">
<div class="top"><div><div id="total" class="total">0 yellow cars</div><div class="sub">Ready when you are!</div></div><div id="timer" class="timer">00:00</div></div>
<div id="scores"></div>
<div class="actions"><button id="undo" class="secondary">↶ Undo</button><button id="finish" class="finish">Finish trip</button></div>
<div class="small">Passenger operates the game. Driver keeps eyes on the road.</div>
</section>
<section id="result" class="card hidden"><div style="text-align:center;font-size:52px">🏆</div><div id="winner" class="winner"></div><p id="summary" class="sub" style="text-align:center"></p><div id="final"></div><button id="again" class="primary">🚗 Play again!</button></section>
</main>
<script>
const $=s=>document.querySelector(s);
const ACTIVE_KEY='yellowCarSSActiveTrip';
const HISTORY_KEY='yellowCarTrips';
let players=[],hits=[],startTime=null,tick=null;
const fmt=n=>{n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const elapsed=()=>startTime?Math.floor((Date.now()-startTime)/1000):0;
const total=()=>players.reduce((n,p)=>n+p.score,0);
function saveActive(){if(!startTime)return;localStorage.setItem(ACTIVE_KEY,JSON.stringify({startTime,players,hits}))}
function clearActive(){localStorage.removeItem(ACTIVE_KEY)}
function updateTimer(){$('#timer').textContent=fmt(elapsed())}
function startTicker(){clearInterval(tick);updateTimer();tick=setInterval(updateTimer,1000)}
function flash(p){let f=$('#flash');f.textContent='YELLOW CAR! 🚗  +1 '+p.name.toUpperCase()+'!';f.classList.remove('hidden');setTimeout(()=>f.classList.add('hidden'),900)}
function render(){
$('#total').textContent=total()+' yellow car'+(total()==1?'':'s');
let s=$('#scores');s.innerHTML='';
players.forEach((p,i)=>{let r=document.createElement('div');r.className='score';let l=document.createElement('span');l.textContent=p.icon+' '+p.name+' · '+p.score;let b=document.createElement('button');b.className='plus';b.textContent='+';b.onclick=()=>{p.score++;hits.push(i);saveActive();flash(p);render()};r.append(l,b);s.append(r)});
$('#undo').disabled=!hits.length
}
function showHistory(){let box=$('#history'),h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');box.innerHTML=h.length?'<h3>Recent trips</h3>':'';h.slice(0,5).forEach(x=>{let d=document.createElement('div');d.className='history-item';let dur=x.duration?' · '+fmt(x.duration):'';d.textContent=x.date+' — '+x.winner+' · '+x.total+' yellow cars'+dur;box.append(d)})}
function showGame(){$('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#game').classList.remove('hidden');render();startTicker()}
function restoreActive(){try{let x=JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null');if(!x||!x.startTime||!Array.isArray(x.players))return false;startTime=x.startTime;players=x.players;hits=Array.isArray(x.hits)?x.hits:[];showGame();return true}catch(e){clearActive();return false}}
$('#start').onclick=()=>{players=[];[['mum','Mum','👩'],['dad','Dad','👨'],['thomas','Thomas','👦']].forEach(x=>{if($('#'+x[0]).checked)players.push({name:x[1],icon:x[2],score:0})});if(!players.length)return alert('Pick at least one player.');hits=[];startTime=Date.now();saveActive();showGame()}
$('#undo').onclick=()=>{let i=hits.pop();if(i!==undefined&&players[i]&&players[i].score)players[i].score--;saveActive();render()}
$('#finish').onclick=()=>{clearInterval(tick);let duration=elapsed();$('#game').classList.add('hidden');$('#result').classList.remove('hidden');let max=Math.max(...players.map(p=>p.score)),wins=players.filter(p=>p.score===max).map(p=>p.name),w=wins.length>1?'Draw':wins[0]+' wins!';$('#winner').textContent=wins.length>1?'It’s a draw! 🎉':wins[0]+' wins! 🎉';$('#summary').textContent='You spotted '+total()+' yellow cars in '+fmt(duration)+'!';let f=$('#final');f.innerHTML='';players.forEach(p=>{let d=document.createElement('div');d.className='score';d.innerHTML='<span>'+p.icon+' '+p.name+'</span><strong>'+p.score+'</strong>';f.append(d)});let h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');h.unshift({date:new Date().toLocaleDateString('en-AU'),winner:w,total:total(),scores:players,duration});localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,50)));clearActive()}
$('#again').onclick=()=>{clearActive();location.reload()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&startTime)updateTimer()});
window.addEventListener('pageshow',()=>{if(startTime)updateTimer()});
window.addEventListener('beforeunload',saveActive);
showHistory();restoreActive();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=5');
</script></body></html>
